# Names for the functions the Switch code hooks, added to the PC port's manifest (gears-of-war-2-pc-port's
# gow2_manifest.toml) by tools/codegen.sh. Addresses are the retail executable's (63AF211E 0.0.0.5 and 33FCE762 0.0.0.6 have
# the same code).
#
# XDK Direct3D: every shader the game creates (src/gow2_shader_dump.cpp; CMake compiles those hooks when both names are
# here). Prefixed: the SDK exports stubs named __imp__D3DDevice_Create*Shader (xam_misc.cpp), and a bare name would
# make the game's function that stub. Found with tools/match_funcs.py / tools/fuzzy_find.py against Dead Space 2's
# named tree: CreateVertexShader is instruction for instruction DS2's D3DDevice_CreateVertexShader (0x82220568, 60
# instructions); CreatePixelShader is its neighbour with the shape of DS2's D3DDevice_CreatePixelShader (0x822201C0:
# same 60-68 instructions, the same callback check and container reads from r3; ratio 0.875).
[entrypoint.functions.0x829832E8]
name = "gow2_D3DDevice_CreateVertexShader"

[entrypoint.functions.0x82982F20]
name = "gow2_D3DDevice_CreatePixelShader"

# Memory: the game's out-of-memory handler (UE3 appOutOfMemory: called by its pooled allocator with the size it could
# not get) and its VirtualAlloc wrapper (NtAllocateVirtualMemory; 0 on failure). src/gow2_memory_hooks.cpp logs them:
# loading the first level, the allocator recursed through the handler until the main thread's stack ran out.
[entrypoint.functions.0x827F7638]
name = "gow2_appOutOfMemory"

[entrypoint.functions.0x82AAA880]
name = "gow2_VirtualAlloc"
